<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de usuarios</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>Registro de usuarios</h1>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Acerca de</a>
      <a href="#">Contacto</a>
      <button type="button">Iniciar sesión</button>
    </nav>
  </header>

  <main>
    <form action="#" method="post">

      <section id="datos-personales">
        <h2>Datos personales y de contacto</h2>

        <fieldset>
          <legend>Información Personal</legend>

          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>

          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" required>

          <label for="nacimiento">Fecha de nacimiento</label>
          <input type="date" id="nacimiento" name="nacimiento" required>

          <p class="etiqueta">Género</p>
          <div class="opciones">
            <input type="radio" id="masculino" name="genero" value="masculino" required>
            <label for="masculino">Masculino</label>

            <input type="radio" id="femenino" name="genero" value="femenino">
            <label for="femenino">Femenino</label>

            <input type="radio" id="otro" name="genero" value="otro">
            <label for="otro">Otro</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Información de Contacto</legend>

          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" required>

          <label for="telefono">Número de teléfono</label>
          <input type="tel" id="telefono" name="telefono" required>

          <label for="direccion">Dirección</label>
          <textarea id="direccion" name="direccion" rows="3"></textarea>
        </fieldset>
      </section>

      <section id="cuenta-preferencias">
        <h2>Cuenta y preferencias</h2>

        <fieldset>
          <legend>Información de Cuenta</legend>

          <label for="usuario">Nombre de usuario</label>
          <input type="text" id="usuario" name="usuario" required>

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required>

          <label for="confirmar">Confirmar contraseña</label>
          <input type="password" id="confirmar" name="confirmar" required>
        </fieldset>

        <fieldset>
          <legend>Preferencias</legend>

          <label for="color">Color favorito</label>
          <select id="color" name="color">
            <option value="rojo">Rojo</option>
            <option value="azul">Azul</option>
            <option value="verde">Verde</option>
            <option value="amarillo">Amarillo</option>
          </select>

          <div class="opciones terminos">
            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Acepto los Términos y Condiciones</label>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Crear cuenta</button>
      </section>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Registro de usuarios. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
